services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warmoven
      POSTGRES_PASSWORD: warmoven
      POSTGRES_DB: warmoven
    ports:
      - "5432:5432"
    volumes:
      - warmoven_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ui:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    command: >
      streamlit run streamlit_app/Home.py --server.address 0.0.0.0 --server.port 8501

volumes:
  warmoven_pgdata:
